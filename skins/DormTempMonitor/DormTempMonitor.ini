; DormTempMonitor —— 米家温湿度计 3 mini 的雨滴皮肤（v4.5 分体布局）
; 数据来源: DormTemp.dll 插件（C++/WinRT 在插件内直读 BLE，无外部进程）
; 主面板只显示实时数据。汇总卡片与历史曲线都在 Cards\ 下，各自是独立皮肤，
; 可以随意挑几个跟主面板一起激活（右键托盘图标 → 管理 → 勾选）：
;   Cards\Today\Today.ini / Day\Day.ini / Week\Week.ini  今日 / 24 小时 / 7 天 汇总
;   Cards\ChartToday\ChartToday.ini 等                   对应区间的温度曲线
; 数值与单位分开渲染：数值用强调色 + 加粗，单位用暗色 + 小字号

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
@Include=#@#Theme.inc

[Metadata]
Name=DormTempMonitor
Author=kmizmal
Information=米家温湿度计 3 mini 显示器（实时面板；汇总卡片与曲线为独立皮肤）
Version=4.5
License=GPL-3.0

[Variables]
; 单位字号（数值固定用大字号，单位另配小字号）
UnitSizeTemp=12
UnitSizeHum=8
; 单位纵向微调（正值下移，负值上移），单位底边对齐数值底边后再偏移这么多像素
UnitOffsetTemp=-4
UnitOffsetHum=-2

; ============ 插件测量值 ============
[MeasureTemp]
Measure=Plugin
Plugin=DormTemp
Type=Temperature
LogPath=#DataPath#
DeviceName=#DeviceName#
MacAddress=#MacAddress#
UpdateDivider=5

[MeasureHum]
Measure=Plugin
Plugin=DormTemp
Type=Humidity
UpdateDivider=5

[MeasureStatus]
Measure=Plugin
Plugin=DormTemp
Type=Status
UpdateDivider=5

[MeasureLastUpdate]
Measure=Plugin
Plugin=DormTemp
Type=LastUpdate
UpdateDivider=5

[MeasureBattery]
Measure=Plugin
Plugin=DormTemp
Type=Battery
UpdateDivider=5

[MeasureComfort]
Measure=Plugin
Plugin=DormTemp
Type=Comfort
UpdateDivider=5

; ============ 背景 ============
[MeterBg]
Meter=Shape
Shape=Rectangle 0,0,224,112,14 | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color 255,255,255,18
RightMouseUpAction=["#DataPath#"]
ToolTipText=右键打开数据目录
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=StyleLabel
X=16
Y=12
Text=米家温湿度计 3 mini

[MeterStatus]
Meter=String
MeterStyle=StyleLabel
FontSize=8
FontColor=#ColorWarn#
X=208
Y=13
StringAlign=Right
MeasureName=MeasureStatus
Text=%1

; ---- 温度：数值与单位分色 ----
[MeterTemp]
Meter=String
FontFace=#FontName#
FontSize=32
FontWeight=600
FontColor=#ColorAccent#
AntiAlias=1
X=14
Y=28
MeasureName=MeasureTemp
Text=%1

[MeterTempUnit]
Meter=String
FontFace=#FontName#
FontSize=#UnitSizeTemp#
FontColor=#ColorDim#
AntiAlias=1
X=4R
Y=([MeterTemp:Y]+[MeterTemp:H]+#UnitOffsetTemp#)
StringAlign=LeftBottom
DynamicVariables=1
Text=°C

; ---- 湿度：右侧，与温度并列 ----
[MeterHumLabel]
Meter=String
MeterStyle=StyleSmall
FontSize=8
FontColor=#ColorDim#
X=152
Y=34
Text=湿度

[MeterHum]
Meter=String
FontFace=#FontName#
FontSize=16
FontWeight=600
FontColor=#ColorMain#
AntiAlias=1
X=150
Y=44
MeasureName=MeasureHum
Text=%1

[MeterHumUnit]
Meter=String
FontFace=#FontName#
FontSize=#UnitSizeHum#
FontColor=#ColorDim#
AntiAlias=1
X=3R
Y=([MeterHum:Y]+[MeterHum:H]+#UnitOffsetHum#)
StringAlign=LeftBottom
DynamicVariables=1
Text=% RH

[MeterComfort]
Meter=String
MeterStyle=StyleSmall
FontSize=8
FontColor=#ColorDim#
X=152
Y=70
MeasureName=MeasureComfort
Text=%1

[MeterBottom]
Meter=String
MeterStyle=StyleLabel
FontSize=8
X=16
Y=86
MeasureName=MeasureLastUpdate
MeasureName2=MeasureBattery
Text=%1   %2
