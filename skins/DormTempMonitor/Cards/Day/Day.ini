; 近 24 小时汇总卡片
; 独立的可选皮肤：与主面板（config = DormTempMonitor）互不影响，
; 可以任意组合同时激活。右键托盘图标 → 管理 → 勾选即可。
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=0
WindowY=228
@Include=#ROOTCONFIGPATH#@Resources\Theme.inc
@Include2=#ROOTCONFIGPATH#@Resources\Card.inc

[Metadata]
Name=DormTempCardDay
Author=WorkBuddy
Information=近 24 小时汇总卡片
Version=4.3
License=GPL-3.0

[Variables]
CardWindow=24h
CardTitle=24 小时均温
