; 今日温度曲线卡片
; 独立的可选皮肤：与主面板（config = DormTempMonitor）互不影响，
; 可以任意组合同时激活。右键托盘图标 → 管理 → 勾选即可。
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=240
WindowY=0
@Include=#ROOTCONFIGPATH#@Resources\Theme.inc
@Include2=#ROOTCONFIGPATH#@Resources\Chart.inc

[Metadata]
Name=DormTempChartToday
Author=WorkBuddy
Information=今日温度曲线卡片
Version=4.3
License=MIT

[Variables]
ChartKey=today
ChartWindow=Today
ChartTitle=今日曲线
