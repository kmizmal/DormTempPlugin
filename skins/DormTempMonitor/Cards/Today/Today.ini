; 今日汇总卡片（均温 / 最高 / 最低 / 湿度 / 样本数）
; 独立的可选皮肤：与主面板（config = DormTempMonitor）互不影响，
; 可以任意组合同时激活。右键托盘图标 → 管理 → 勾选即可。
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
WindowX=0
WindowY=140
@Include=#ROOTCONFIGPATH#@Resources\Theme.inc
@Include2=#ROOTCONFIGPATH#@Resources\Card.inc

