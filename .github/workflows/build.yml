name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交直接顶掉上一次构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.13.0
  ZIG: C:\zig\zig.exe
  # 构建脚本里 print 的是中文，en-US 镜像的 cp1252 控制台会直接抛异常
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: 编译 / 测试 / 打包
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 检出
        uses: actions/checkout@v4

      # 版本号只在皮肤里写一份，包名和产物名都跟着它走
      - name: 读取皮肤版本号
        id: meta
        shell: pwsh
        run: |
          $line = (Select-String -Path 'skins/DormTempMonitor/DormTempMonitor.ini' -Pattern '^Version=').Line
          $version = ($line -replace '^Version=', '').Trim()
          if (-not $version) { throw '皮肤 [Metadata] 里找不到 Version=' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "皮肤版本 $version"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 79 MB 的 zig 每次重下太慢，按版本号缓存
      - name: 缓存 zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: C:\zig
          key: zig-${{ env.ZIG_VERSION }}-windows-x86_64

      - name: 安装 zig ${{ env.ZIG_VERSION }}
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'zig.zip'
          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing; break }
            catch {
              if ($i -eq 3) { throw }
              Write-Host "下载失败（第 $i 次），重试…"
              Start-Sleep -Seconds (5 * $i)
            }
          }
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'zig-unpack') -Force
          Move-Item (Join-Path $env:RUNNER_TEMP "zig-unpack\zig-windows-x86_64-$env:ZIG_VERSION") 'C:\zig'
          & 'C:\zig\zig.exe' version

      # winrt_gen/ 是 64 MB 生成物、不入库；用 SDK 自带的 cppwinrt 现生成，
      # 生成结果按 SDK 版本缓存，SDK 升级时 key 自然失效
      - name: 定位 cppwinrt
        id: sdk
        shell: pwsh
        run: |
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Test-Path $root)) { throw "找不到 Windows SDK：$root" }
          $found = Get-ChildItem $root -Directory |
            ForEach-Object { Join-Path $_.FullName 'x64\cppwinrt.exe' } |
            Where-Object { Test-Path $_ } |
            Sort-Object { [version](Split-Path (Split-Path $_ -Parent) -Parent | Split-Path -Leaf) } |
            Select-Object -Last 1
          if (-not $found) { throw 'Windows SDK 里没有 x64\cppwinrt.exe' }
          "exe=$found" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$((Split-Path (Split-Path $found -Parent) -Parent | Split-Path -Leaf))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "cppwinrt：$found"

      - name: 缓存 WinRT 投影头
        id: winrt-cache
        uses: actions/cache@v4
        with:
          path: winrt_gen
          key: winrt-gen-${{ steps.sdk.outputs.version }}-v2

      # 2026-10-27 两次失败都在这：先以为镜像没有 WinMetadata，实测它在那儿（20 个 winmd），
      # 真正的原因是 cppwinrt 不认 "*.winmd" 通配符——本地能过只是 shell 替我们展开了。
      # 现在按目录喂，并在没产出时退回逐个文件；来源按三处依次找，都缺才报错。
      - name: 生成 WinRT 投影头
        if: steps.winrt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $cppwinrt = '${{ steps.sdk.outputs.exe }}'
          $sdkVer   = '${{ steps.sdk.outputs.version }}'
          $kits     = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10'
          $winMeta  = Join-Path $env:WINDIR 'System32\WinMetadata'
          $refs     = Join-Path $kits "References\$sdkVer"
          $union    = Join-Path $kits "UnionMetadata\$sdkVer\Windows.winmd"

          $winmds = @()
          $source = $null

          if (Test-Path $winMeta) {
            $winmds = @(Get-ChildItem "$winMeta\*.winmd" | ForEach-Object FullName)
            $source = $winMeta
          }
          if (-not $winmds -and (Test-Path $refs)) {
            $winmds = @(Get-ChildItem $refs -Recurse -Filter *.winmd |
                        Sort-Object FullName -Unique | ForEach-Object FullName)
            $source = $refs
          }
          if (-not $winmds -and (Test-Path $union)) {
            $winmds = @($union)
            $source = $union
          }
          if (-not $winmds) {
            throw "找不到 WinRT 元数据：$winMeta、$refs、$union 都不存在"
          }

          Write-Host "元数据来源 $source（$($winmds.Count) 个 winmd）"
          # cppwinrt 不展开 *.winmd 通配符（本地能跑是因为命令行自己展开过），
          # 只吃「目录」或「具体文件」；把散落的 winmd 汇到一个目录再喂进去
          $stage = Join-Path $env:RUNNER_TEMP 'winmd'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($f in $winmds) { Copy-Item $f -Destination $stage -Force }

          & $cppwinrt -in $stage -out winrt_gen
          if (-not (Test-Path 'winrt_gen\winrt\base.h')) {
            # 目录形式不认时再退回逐个文件
            Write-Host '目录形式没产出 base.h，改用逐个 -in 重试'
            $argv = @()
            foreach ($f in $winmds) { $argv += @('-in', $f) }
            & $cppwinrt @argv -out winrt_gen
          }
          if (-not (Test-Path 'winrt_gen\winrt\base.h')) { throw 'cppwinrt 没生成 winrt/base.h' }
          Write-Host "生成完毕：$((Get-ChildItem winrt_gen -Recurse -File | Measure-Object).Count) 个文件"

      - name: 编译插件 + 跑测试
        run: python build_plugin.py --test --probe

      - name: 打包 .rmskin
        run: python build_package.py

      - name: 产物摘要
        shell: pwsh
        run: |
          $rmskin = Get-ChildItem 'dist\*.rmskin' | Select-Object -First 1
          $dll = Get-Item 'dist\plugin\DormTemp.dll'
          $lines = @(
            '### 构建产物',
            '',
            '| 文件 | 大小 | SHA-256 |',
            '| --- | --- | --- |',
            "| $($rmskin.Name) | $([math]::Round($rmskin.Length / 1KB)) KB | ``$((Get-FileHash $rmskin -Algorithm SHA256).Hash.ToLower())`` |",
            "| DormTemp.dll | $([math]::Round($dll.Length / 1KB)) KB | ``$((Get-FileHash $dll -Algorithm SHA256).Hash.ToLower())`` |",
            '',
            "zig $env:ZIG_VERSION · cppwinrt ${{ steps.sdk.outputs.version }} · 皮肤 ${{ steps.meta.outputs.version }}"
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DormTempMonitor-${{ steps.meta.outputs.version }}
          path: |
            dist/*.rmskin
            dist/plugin/DormTemp.dll
            dist/DormProbe.exe
          if-no-files-found: error
          retention-days: 30
